<script>
/* PhotoStudio - passport photo maker for the DAV student directory.
   Usage: PhotoStudio.open({size:'35x45', bg:'#ffffff', maxKB:200, onDone:(blob,dataUrl)=>{...}}) */
(function(){
let ai=null;
const CSS=`
:host{--bg:#f3f1ec;--card:#fffefb;--tx:#16191f;--mut:#5d6572;--ac:#17324d;--bd:#d8d4ca;--ok:#18794e;--pt:#fff;
position:fixed;inset:0;z-index:2147483000;display:block;overflow-y:auto;overflow-x:hidden;background:var(--bg);color:var(--tx);
font:16px/1.45 "Segoe UI",Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
@media (prefers-color-scheme:dark){:host{--bg:#14171c;--card:#1d2128;--tx:#eef0f3;--mut:#9ba5b3;--ac:#f0a81c;--bd:#2d343e;--ok:#4cc38a;--pt:#1a1200}}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
.ps{width:100%;max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--card);border-bottom:1px solid var(--bd);font-weight:700}
.pad{padding:12px 14px;flex:1;width:100%}
.stage{display:flex;justify-content:center;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;min-height:150px;overflow:hidden}
canvas,video{display:block;max-width:100%;max-height:42vh;width:auto;height:auto;border-radius:6px}
canvas{background:#fff;border:1px solid var(--bd)}
.ph{color:var(--mut);text-align:center;padding:30px 10px}
.msg{margin:10px 2px 0;color:var(--mut);font-size:.9rem;overflow-wrap:anywhere}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btns button:nth-child(3){grid-column:1/-1}
button,select{font:inherit;min-height:46px;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;max-width:100%}
button.p{background:var(--ac);color:var(--pt);border-color:var(--ac);font-weight:600}
button.g{min-height:38px;padding:4px 14px}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.fi{position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.opts{margin-top:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px 12px 14px}
label{display:grid;gap:4px;font-size:.9rem;color:var(--mut);margin-top:12px}
select{width:100%}
input[type=range]{width:100%;margin:4px 0 0}
.sw{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.sw label,.chk{display:flex;align-items:center;gap:8px;margin:0;color:var(--tx);font-size:1rem}
.chk{margin-top:12px}
input[type=radio],input[type=checkbox]{width:20px;height:20px;flex:none}
.foot{position:sticky;bottom:0;z-index:3;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd)}
.foot button{width:100%}
.info{font-weight:600;font-size:.9rem;margin-bottom:8px;min-height:1.2em}.ok{color:var(--ok)}
`;
const HTML=`<div class="ps">
<div class="bar"><span>Student photo</span><button class="g" data-id="close" type="button">Close</button></div>
<div class="pad">
<div class="stage"><canvas data-id="out" width="413" height="531" hidden></canvas><video data-id="v" playsinline muted hidden></video><div class="ph" data-id="ph">No photo yet</div></div>
<p class="msg" data-id="msg"><small>Tip: plain wall behind, face the light, look straight at the camera, keep both shoulders in view.</small></p>
<div class="btns">
<button class="p" data-id="takeNative" type="button">Take photo</button>
<button data-id="gal" type="button">Choose from gallery</button>
<button data-id="camOn" type="button">Live camera</button>
<button class="p" data-id="snap" type="button" hidden>Capture</button>
<button data-id="flip" type="button" hidden>Switch camera</button>
</div>
<input class="fi" type="file" accept="image/*" capture="environment" data-id="fileCam">
<input class="fi" type="file" accept="image/*" data-id="fileGal">
<div class="opts">
<label>Photo size
<select data-id="size"><option value="35x45">35 × 45 mm (India passport)</option><option value="2x2">2 × 2 inch (US / OCI)</option><option value="33x48">33 × 48 mm</option></select></label>
<div class="sw"><label><input type="radio" name="psbg" value="#ffffff" checked> White</label><label><input type="radio" name="psbg" value="#c2dcf5"> Light blue</label></div>
<label class="chk"><input type="checkbox" data-id="rm" checked> Replace background</label>
<label class="chk"><input type="checkbox" data-id="enh" checked> Enhance light and sharpness</label>
<label data-id="tolL" hidden>Background sensitivity (basic mode)<input type="range" data-id="tol" min="8" max="90" value="34"></label>
<label>Zoom<input type="range" data-id="zoom" min="0.8" max="2" step="0.01" value="1"></label>
<label>Move left / right<input type="range" data-id="px" min="-100" max="100" value="0"></label>
<label>Move up / down<input type="range" data-id="py" min="-100" max="100" value="0"></label>
</div></div>
<div class="foot"><div class="info" data-id="info"></div><button class="p" data-id="save" type="button" disabled>Use this photo</button></div>
</div>`;
function mount(opts,root,host){

const $=id=>root.querySelector('[data-id="'+id+'"]');
const out=$('out'),ctx=out.getContext('2d',{willReadFrequently:true});
const SIZES={'35x45':[413,531],'2x2':[600,600],'33x48':[390,567]};
const VB='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MD='https://storage.googleapis.com/mediapipe-models/';
let src=null,stream=null,facing='environment',blob=null,timer=0,busy=0,person=null,face=null;
const LIM=(opts.maxKB||200)*1000-5000;
function done(){if(stream)stream.getTracks().forEach(t=>t.stop());host.remove()}
const msg=t=>{$('msg').innerHTML='<small>'+t+'</small>'};
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));

let camErr=null;
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('v').hidden=true;$('snap').hidden=true;$('flip').hidden=true}
async function startCam(){
  stopCam();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('Live camera is not available here. Use “Take photo” instead.');return}
  const tries=[{video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1920}},audio:false},{video:true,audio:false}];
  for(const c of tries){try{stream=await navigator.mediaDevices.getUserMedia(c);break}catch(e){camErr=e}}
  if(!stream){msg(camErr&&camErr.name==='NotAllowedError'?'Camera permission is blocked. Allow the camera for this site in browser settings, or use “Take photo”.':'Could not open the live camera. Use “Take photo” instead.');return}
  const v=$('v');v.muted=true;v.srcObject=stream;v.hidden=false;out.hidden=true;$('ph').hidden=true;
  try{await v.play()}catch(_){}
  v.style.transform=facing==='user'?'scaleX(-1)':'none';
  $('snap').hidden=false;$('flip').hidden=false;msg('Place the face in the middle, then tap Capture.');
}
$('camOn').onclick=startCam;
$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';startCam()};
$('snap').onclick=()=>{
  const v=$('v');if(!v.videoWidth){msg('The camera is still starting. Try again in a moment.');return}
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);stopCam();setSrc(c);
};
async function fromFile(f){
  if(!f)return;stopCam();msg('Loading photo…');
  let el;
  try{el=await createImageBitmap(f,{imageOrientation:'from-image'})}
  catch(_){try{const im=new Image();im.src=URL.createObjectURL(f);await im.decode();el=im}catch(e){msg('Could not read that photo. Please try another one.');return}}
  setSrc(el);
}
['fileCam','fileGal'].forEach(id=>{$(id).onchange=e=>{const f=e.target.files[0];e.target.value='';fromFile(f)}});
$('takeNative').onclick=()=>$('fileCam').click();
$('gal').onclick=()=>$('fileGal').click();
function setSrc(el){
  const w=el.naturalWidth||el.width,h=el.naturalHeight||el.height,s=Math.min(1,1280/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
  c.getContext('2d').drawImage(el,0,0,c.width,c.height);
  src=c;$('zoom').value=1;$('px').value=0;$('py').value=0;
  analyze().then(render);
}

async function loadAI(){
  if(ai)return ai;
  try{
    const V=await import(VB+'/vision_bundle.mjs');
    const fs=await V.FilesetResolver.forVisionTasks(VB+'/wasm');
    const seg=await V.ImageSegmenter.createFromOptions(fs,{baseOptions:{modelAssetPath:MD+'image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite',delegate:'CPU'},runningMode:'IMAGE',outputConfidenceMasks:true,outputCategoryMask:false});
    let fd=null;
    try{fd=await V.FaceDetector.createFromOptions(fs,{baseOptions:{modelAssetPath:MD+'face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite',delegate:'CPU'},runningMode:'IMAGE'})}catch(_){}
    ai={seg,fd};
  }catch(e){ai=null}
  return ai;
}

async function analyze(){
  person=null;face=null;
  msg('Analysing photo… the first time this downloads a small AI model (about 10 MB).');
  const A=await loadAI();
  if(A){
    try{
      const r=A.seg.segment(src),m=r.confidenceMasks[0],bgp=m.getAsFloat32Array(),mw=m.width,mh=m.height;
      const mc=document.createElement('canvas');mc.width=mw;mc.height=mh;
      const mx=mc.getContext('2d'),id=mx.createImageData(mw,mh);
      for(let i=0;i<mw*mh;i++){const v=Math.round(255*cl(1-bgp[i],0,1));id.data[4*i]=id.data[4*i+1]=id.data[4*i+2]=v;id.data[4*i+3]=255}
      mx.putImageData(id,0,0);r.close();
      person={c:mc,w:mw,h:mh};
      const det=A.fd&&A.fd.detect(src).detections[0];
      if(det){
        const b=det.boundingBox,x0=Math.max(0,Math.floor((b.originX-b.width*.5)*mw/src.width)),x1=Math.min(mw-1,Math.ceil((b.originX+b.width*1.5)*mw/src.width));
        let top=null;
        for(let y=0;y<mh&&top===null;y++){let n=0;for(let x=x0;x<=x1;x++)if(bgp[y*mw+x]<.5)n++;if(n>=3)top=y*src.height/mh}
        let crown=top===null?b.originY-b.height*.45:Math.max(top,b.originY-b.height*.9);
        crown=Math.min(crown,b.originY);
        face={cx:b.originX+b.width/2,crown,chin:b.originY+b.height*1.05};
      }
      $('tolL').hidden=true;
      msg('Smart cut-out is on. Check the edges, then adjust zoom or position if needed.');
    }catch(e){person=null}
  }
  if(!person){$('tolL').hidden=false;msg('Basic cut-out is on (the AI model could not load, so connect to the internet once). Use a plain wall and adjust sensitivity.')}
}

function cropRect(W,H){
  const ar=W/H,sw=src.width,sh=src.height;let cw,ch,cx,cy;
  if(face){ch=(face.chin-face.crown)/.72;cw=ch*ar;cx=face.cx-cw/2;cy=face.crown-.1*ch}
  else{cw=Math.min(sw,sh*ar);ch=cw/ar;cx=(sw-cw)/2;cy=(sh-ch)/2}
  const z=+$('zoom').value;
  const mx=cx+cw/2+(+$('px').value/100)*cw/2,my=cy+ch/2+(+$('py').value/100)*ch/2;
  cw/=z;ch/=z;cx=mx-cw/2;cy=my-ch/2;
  cx=cw<=sw?cl(cx,0,sw-cw):(sw-cw)/2;cy=ch<=sh?cl(cy,0,sh-ch):(sh-ch)/2;
  return [cx,cy,cw,ch];
}

function boxF(s,W,H,r){
  const t=new Float32Array(s.length),o=new Float32Array(s.length),c=new Float64Array(Math.max(W,H)+1);
  for(let y=0;y<H;y++){c[0]=0;for(let x=0;x<W;x++)c[x+1]=c[x]+s[y*W+x];
    for(let x=0;x<W;x++){const a=Math.max(0,x-r),b=Math.min(W-1,x+r);t[y*W+x]=(c[b+1]-c[a])/(b-a+1)}}
  for(let x=0;x<W;x++){c[0]=0;for(let y=0;y<H;y++)c[y+1]=c[y]+t[y*W+x];
    for(let y=0;y<H;y++){const a=Math.max(0,y-r),b=Math.min(H-1,y+r);o[y*W+x]=(c[b+1]-c[a])/(b-a+1)}}
  return o;
}
function guided(I,P,W,H,r,eps){
  const N=I.length,mI=boxF(I,W,H,r),mP=boxF(P,W,H,r),II=new Float32Array(N),IP=new Float32Array(N);
  for(let i=0;i<N;i++){II[i]=I[i]*I[i];IP[i]=I[i]*P[i]}
  const cII=boxF(II,W,H,r),cIP=boxF(IP,W,H,r),A=new Float32Array(N),B=new Float32Array(N);
  for(let i=0;i<N;i++){const v=cII[i]-mI[i]*mI[i],cv=cIP[i]-mI[i]*mP[i];A[i]=cv/(v+eps);B[i]=mP[i]-A[i]*mI[i]}
  const mA=boxF(A,W,H,r),mB=boxF(B,W,H,r),Q=new Float32Array(N);
  for(let i=0;i<N;i++)Q[i]=mA[i]*I[i]+mB[i];
  return Q;
}

function floodAlpha(d,W,H){
  let r=0,g=0,b=0,n=0;
  const add=(x,y)=>{const i=(y*W+x)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++};
  for(let x=0;x<W;x+=4)add(x,2);
  for(let y=0;y<H*.4;y+=4){add(2,y);add(W-3,y)}
  r/=n;g/=n;b/=n;
  const t=+$('tol').value,t2=t*t*3;
  const near=p=>{const i=p*4,a=d[i]-r,c=d[i+1]-g,e=d[i+2]-b;return a*a+c*c+e*e<t2};
  const m=new Uint8Array(W*H),st=new Int32Array(W*H);let sp=0;
  const push=p=>{if(!m[p]&&near(p)){m[p]=1;st[sp++]=p}};
  for(let x=0;x<W;x++)push(x);
  for(let y=0;y<H;y++){push(y*W);push(y*W+W-1)}
  while(sp){const p=st[--sp],x=p%W,y=(p/W)|0;
    if(x>0)push(p-1);if(x<W-1)push(p+1);if(y>0)push(p-W);if(y<H-1)push(p+W)}
  const f=new Float32Array(W*H);for(let p=0;p<f.length;p++)f[p]=1-m[p];
  return boxF(f,W,H,2);
}

function composite(W,H,bgc,cx,cy,cw,ch){
  const im=ctx.getImageData(0,0,W,H),d=im.data,N=W*H,L=new Float32Array(N);
  for(let p=0;p<N;p++)L[p]=(.299*d[4*p]+.587*d[4*p+1]+.114*d[4*p+2])/255;
  let a0;
  if(person){
    const mc=document.createElement('canvas');mc.width=W;mc.height=H;
    const mx=mc.getContext('2d',{willReadFrequently:true});
    mx.fillStyle='#000';mx.fillRect(0,0,W,H);mx.imageSmoothingQuality='high';
    const kx=person.w/src.width,ky=person.h/src.height;
    mx.drawImage(person.c,cx*kx,cy*ky,cw*kx,ch*ky,0,0,W,H);
    const md=mx.getImageData(0,0,W,H).data;a0=new Float32Array(N);
    for(let p=0;p<N;p++)a0[p]=md[4*p]/255;
  }else a0=floodAlpha(d,W,H);
  const q=guided(L,a0,W,H,Math.max(4,Math.round(W*.02)),5e-4),a=new Float32Array(N);
  for(let p=0;p<N;p++)a[p]=cl((q[p]-.52)*2.4+.5,0,1);
  let br=0,bg=0,bb=0,n=0;
  for(let p=0;p<N;p+=5)if(a[p]<.02){br+=d[4*p];bg+=d[4*p+1];bb+=d[4*p+2];n++}
  if(n<50){br=bg=bb=235}else{br/=n;bg/=n;bb/=n}
  const enh=$('enh').checked;let lo=0,g=1,sh=null;
  if(enh){
    const h=new Uint32Array(256);let c=0;
    for(let p=0;p<N;p++)if(a[p]>.95){h[Math.round(L[p]*255)]++;c++}
    if(c>500){let s=0,i=0;while(i<255&&s<c*.01)s+=h[i++];lo=i;s=0;i=255;while(i>0&&s<c*.01)s+=h[i--];g=cl(235/Math.max(40,i-lo),.9,1.3)}
    const lb=boxF(L,W,H,1);sh=new Float32Array(N);
    for(let p=0;p<N;p++)sh[p]=(L[p]-lb[p])*255*.7;
  }
  const R0=parseInt(bgc.slice(1,3),16),G0=parseInt(bgc.slice(3,5),16),B0=parseInt(bgc.slice(5,7),16);
  for(let p=0;p<N;p++){
    const i=4*p,k=a[p];
    if(k<.003){d[i]=R0;d[i+1]=G0;d[i+2]=B0;continue}
    let R=d[i],G=d[i+1],B=d[i+2];
    if(k<.98&&k>.15){R=cl((R-(1-k)*br)/k,0,255);G=cl((G-(1-k)*bg)/k,0,255);B=cl((B-(1-k)*bb)/k,0,255)}
    if(enh){
      R=R*.4+.6*((R-lo)*g+10)+sh[p];G=G*.4+.6*((G-lo)*g+10)+sh[p];B=B*.4+.6*((B-lo)*g+10)+sh[p];
    }
    d[i]=cl(R,0,255)*k+R0*(1-k);d[i+1]=cl(G,0,255)*k+G0*(1-k);d[i+2]=cl(B,0,255)*k+B0*(1-k);
  }
  ctx.putImageData(im,0,0);
}

function render(){
  if(!src)return;out.hidden=false;$('ph').hidden=true;
  const [W,H]=SIZES[$('size').value];out.width=W;out.height=H;
  const [cx,cy,cw,ch]=cropRect(W,H),bgc=root.querySelector('input[name=psbg]:checked').value;
  ctx.fillStyle=bgc;ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(src,cx,cy,cw,ch,0,0,W,H);
  if($('rm').checked)composite(W,H,bgc,cx,cy,cw,ch);
  clearTimeout(timer);timer=setTimeout(compress,300);
}

const toBlob=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
async function compress(){
  const id=++busy;let c=out,scale=1,best=null;
  for(let k=0;k<6&&!best;k++){
    if(scale<1){c=document.createElement('canvas');c.width=Math.round(out.width*scale);c.height=Math.round(out.height*scale);c.getContext('2d').drawImage(out,0,0,c.width,c.height)}
    let lo=.3,hi=opts.maxQ||.97;
    for(let i=0;i<7;i++){const q=(lo+hi)/2,b=await toBlob(c,q);if(b.size<=LIM){best=b;lo=q}else hi=q}
    scale*=.85;
  }
  if(id!==busy||!best)return;
  blob=best;
  $('info').innerHTML='<span class="ok">'+Math.round(best.size/1024)+' KB</span> · '+out.width+' × '+out.height+' px (under 200 KB)';
  $('save').disabled=false;
  
}

$('save').onclick=()=>{
  if(!blob)return;
  const fr=new FileReader();
  fr.onload=()=>{const b=blob;done();opts.onDone&&opts.onDone(b,fr.result)};
  fr.readAsDataURL(blob);
};
$('close').onclick=()=>{done();opts.onCancel&&opts.onCancel()};
if(opts.size&&SIZES[opts.size])$('size').value=opts.size;
if(opts.bg){const r=root.querySelector('input[name=psbg][value="'+opts.bg+'"]');if(r)r.checked=true}
['size','rm','enh','tol','zoom','px','py'].forEach(id=>$(id).addEventListener('input',render));
root.querySelectorAll('input[name=psbg]').forEach(e=>e.addEventListener('change',render));

}
window.PhotoStudio={open(opts){
  opts=opts||{};
  const host=document.createElement('div');
  const root=host.attachShadow({mode:'open'});
  root.innerHTML='<style>'+CSS+'</style>'+HTML;
  document.body.appendChild(host);
  mount(opts,root,host);
}};
})();

const list=a=>a.length?a.slice().sort(cmp).map(row).join(''):'<p class="cnt">No students found.</p>';
function find(q){const k=q.toLowerCase().split(/\s+/).filter(Boolean);return S.filter(s=>{const h=(s.name+' '+s.adm+' '+s.father+' '+s.mother+' '+s.phone+' '+s.addr+' '+s.cls+' '+s.house).toLowerCase();return k.every(w=>h.includes(w))})}
function issues(){const by={};S.forEach(s=>(by[s.adm]??=[]).push(s));
return{dup:Object.entries(by).filter(([a,v])=>v.length>1),noh:S.filter(s=>!s.house&&s.cls!='Passed Out'),bp:S.filter(s=>!/^\d{10}$/.test(s.phone))}}
function render(){
 $('#st').textContent=(session?'Session '+session+', ':'')+sync;$('#fab').style.display=st.tab!='m'?'':'none';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==st.tab));
 let h='';
 if(st.tab=='s'){const a=st.q.trim()?find(st.q):S;h=`<div class="cnt">${a.length} of ${S.length} students</div>`+list(a)}
 else if(st.tab=='c'){
  if(st.cls==null)h='<div class="bar"><span class="cnt" style="margin:0">Tap a class to open it</span><button class="btn sm" data-pdf="c:">PDF of all classes</button></div><div class="grid">'+[...CL,'Passed Out'].filter(c=>c!='Passed Out'||S.some(s=>s.cls==c)).map(c=>{const n=S.filter(s=>s.cls==c).length;return`<button class="tile" data-cls="${c}"><span class="nm">${c}</span><em>${n}</em></button>`}).join('')+'</div>';
  else{const a=S.filter(s=>s.cls==st.cls);h=`<div class="bar"><button class="back" data-act="back">&larr; All classes</button><span style="display:flex;gap:6px"><button class="btn sm" data-pdf="c:${st.cls}">List PDF</button><button class="btn sm" data-idpdf="c:${st.cls}">ID cards</button></span></div><div class="cnt">${st.cls}: ${a.length} students</div>`+list(a)}}
 else if(st.tab=='h'){
  if(st.house==null)h='<div class="bar"><span class="cnt" style="margin:0">Tap a house to open it</span><button class="btn sm" data-pdf="h:">PDF of all houses</button></div><div class="grid">'+[...Object.keys(HS),''].map(x=>{const n=S.filter(s=>s.cls!='Passed Out'&&s.house==x).length;return`<button class="tile hbtn" style="--c:${hc(x)}" data-house="${x||'-'}"><span class="nm">${x?x+' House':'No house yet'}</span><em>${n}</em></button>`}).join('')+'</div>';
  else{const k=st.house=='-'?'':st.house,a=S.filter(s=>s.cls!='Passed Out'&&s.house==k);h=`<div class="bar"><button class="back" data-act="back">&larr; All houses</button><span style="display:flex;gap:6px"><button class="btn sm" data-pdf="h:${st.house}">List PDF</button><button class="btn sm" data-idpdf="h:${st.house}">ID cards</button></span></div><div class="cnt">${k?k+' House':'No house yet'}: ${a.length} students</div>`+list(a)}}
 else{const i=issues(),n=i.dup.length+i.noh.length+i.bp.length;
  h=`<h3>Manage</h3><div class="acts"><button class="btn p" data-act="add">Add student</button><button class="btn" data-act="csv">Download CSV</button></div>
  <div class="acts"><button class="btn" data-act="imp">Import from Excel</button><button class="btn d" data-act="out">Sign out</button></div><div class="cnt">Signed in as ${esc(user&&user.email)}</div>
  <h3>Session: ${esc(session)||'not set'}</h3><div class="acts"><button class="btn p" data-act="sess">Start new session</button><button class="btn" data-act="school">School name and session</button><button class="btn" data-act="undo">Undo last session change</button></div><h3>Data check ${n?'':'(all clear)'}</h3>`;
  if(i.dup.length)h+=`<div class="cnt warn">Same admission number used more than once (${i.dup.length})</div>`+i.dup.map(([a,v])=>v.map(row).join('')).join('');
  if(i.bp.length)h+=`<div class="cnt warn">Phone number is not 10 digits (${i.bp.length})</div>`+i.bp.map(row).join('');
  if(i.noh.length)h+=`<div class="cnt warn">No house assigned (${i.noh.length}). Open a student and tap Edit.</div>`+i.noh.sort(cmp).map(row).join('')}
 $('#main').innerHTML=h}
function sheet(h){const e=$('#sheet');e.innerHTML=h;e.hidden=false;e.scrollTop=0}
const closeSheet=()=>{$('#sheet').hidden=true};
function detail(id){const s=S.find(x=>x.id==id);if(!s)return;
 const f=(l,v)=>`<div class="kv"><small>${l}</small>${esc(v)||'Not set'}</div>`;
 sheet(`<div class="hero"><button class="back" data-act="close">&larr; Back</button><div class="big" id="dph" style="background:${hc(s.house)}">${esc(ini(s.name))}</div><h2>${esc(s.name)}</h2><span class="chip w">${esc(s.cls)}</span>${s.house?`<span class="chip w">${esc(s.house)} House</span>`:''}<span class="chip w">Adm ${esc(s.adm)}</span></div>
 <div class="qa"><a class="btn p" href="tel:${esc(s.phone)}">Call</a><a class="btn" href="https://wa.me/91${esc(s.phone)}" target="_blank">WhatsApp</a><button class="btn" data-edit="${s.id}">Edit</button><button class="btn" data-idc="${s.id}">ID card</button></div>
 <div class="card">${f("Father's name",s.father)}${f("Mother's name",s.mother)}${f('Date of birth',fd(s.dob))}${f('Phone',s.phone)}${f('Address',s.addr)}</div>
 <div class="acts"><button class="btn d" data-del="${s.id}">Delete student</button></div>`);if(s.photo)getPhotos([s.id]).then(()=>{const e=$('#dph');if(e&&PH[s.id]){e.textContent='';e.style.background='url('+PH[s.id]+') center/cover'}}).catch(()=>{})}
function form(id,pre){pend=undefined;const s=id?S.find(x=>x.id==id):{cls:pre||CL[0],house:''};
 const i=(k,l,t='text')=>`<label>${l}</label><input class="f" id="f_${k}" type="${t}" value="${esc(s[k]||'')}">`;
 sheet(`<div class="hero sm"><button class="back" data-act="${id?'back2':'close'}" data-id2="${id||''}">&larr; Cancel</button><h2>${id?'Edit student':'Add student'}</h2></div><div style="height:14px"></div>
 <div class="card pad"><h4>Student</h4>${i('name',"Student's name")}${i('adm','Admission number')}
 <label>Class</label><select class="f" id="f_cls">${[...CL,'Passed Out'].map(c=>`<option ${c==s.cls?'selected':''}>${c}</option>`).join('')}</select>
 <label>House</label><select class="f" id="f_house"><option value="">None</option>${Object.keys(HS).map(x=>`<option value="${x}" ${x==s.house?'selected':''}>${x} House</option>`).join('')}</select>${i('dob','Date of birth','date')}</div>
 <div class="card pad"><h4>Family and contact</h4>${i('father',"Father's name")}${i('mother',"Mother's name")}${i('phone','Phone number','tel')}
 <label>Address</label><textarea class="f" id="f_addr" rows="2">${esc(s.addr||'')}</textarea></div>
 <div class="card pad"><h4>Photo (passport size, under 200 KB)</h4><div style="padding:10px 16px"><button class="btn p" type="button" data-act="ph">Take or choose photo</button><div style="font-size:13px;color:var(--mute);margin-top:6px">The background is replaced with white and the photo is cropped for the ID card.</div><div id="pv"></div>${s.photo?'<button class="btn sm d" style="margin-top:8px" data-act="rmph">Remove current photo</button>':''}</div></div>
 <div class="savebar"><button class="btn p" data-save="${id||''}">Save changes</button></div>`)}
function saveForm(id){const g=k=>$('#f_'+k).value.replace(/\s+/g,' ').trim(),o={};
 ['name','adm','cls','house','father','mother','dob','phone','addr'].forEach(k=>o[k]=g(k));
 if(!o.name||!o.adm){toast('Name and admission number are required');return}
 if(S.some(x=>x.adm==o.adm&&x.id!=id)&&!confirm('Admission number '+o.adm+' already belongs to another student. Save anyway?'))return;
  const ref=id?doc(db,'students',id):doc(SC),sid=ref.id,old=id?S.find(x=>x.id==id):null;
  const data={...o,photo:pend===undefined?(old&&old.photo)||0:(pend?1:0)};
  setDoc(ref,data,{merge:true}).catch(e=>toast('Not saved: '+e.message,8000));
  if(pend!==undefined){delete PH[sid];if(pend){PH[sid]=pend;setDoc(doc(db,'photos',sid),{data:pend}).catch(e=>toast('Photo not saved: '+e.message,8000))}else deleteDoc(doc(db,'photos',sid)).catch(()=>{})}
  if(old)Object.assign(old,data);toast('Saved');id?detail(id):closeSheet()}
document.addEventListener('change',e=>{if(e.target.id!=='f_photo')return;const f=e.target.files[0];if(!f)return;
 if(f.size>200*1024){toast('Photo is '+Math.round(f.size/1024)+' KB. Please choose one up to 200 KB.');e.target.value='';return}
 const img=new Image();img.onload=()=>{const m=Math.min(1,480/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*m);c.height=Math.round(img.height*m);c.getContext('2d').drawImage(img,0,0,c.width,c.height);pend=c.toDataURL('image/jpeg',.85);$('#pv').innerHTML='<img src="'+pend+'" style="height:90px;border-radius:8px;margin-top:8px">'};
 img.onerror=()=>toast('That file is not a valid image');img.src=URL.createObjectURL(f)});
function takePhoto(){PhotoStudio.open({size:'35x45',bg:'#ffffff',maxKB:200,maxQ:.85,onDone:(b,u)=>{pend=u;$('#pv').innerHTML='<img src="'+u+'" style="height:110px;border-radius:8px;margin-top:8px">'}})}
async function getPhotos(ids){const need=ids.filter(i=>!(i in PH));await Promise.all(need.map(async id=>{try{const d=await getDoc(doc(db,'photos',id));PH[id]=d.exists()?d.data().data:''}catch(e){PH[id]=''}}))}
const loadImg=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u});
function wrapTxt(x,t,w){const o=[];let l='';t.split(' ').forEach(wd=>{const n=l?l+' '+wd:wd;if(x.measureText(n).width>w&&l){o.push(l);l=wd}else l=n});if(l)o.push(l);return o}

 const wipe=(x0,y0,x1,y1)=>{const w=x1-x0,h=y1-y0;x.drawImage(T,x0-6,y0,1,h,x0,y0,w,h);
  const t=document.createElement('canvas');t.width=w;t.height=h;const c=t.getContext('2d');
  c.drawImage(T,x1+6,y0,1,h,0,0,w,h);c.globalCompositeOperation='destination-in';
  const g=c.createLinearGradient(0,0,w,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');c.fillStyle=g;c.fillRect(0,0,w,h);x.drawImage(t,x0,y0)};

 if(im){const t=document.createElement('canvas');t.width=t.height=1;const tc=t.getContext('2d');
  tc.drawImage(im,0,0,Math.min(8,im.width),Math.min(8,im.height),0,0,1,1);const d=tc.getImageData(0,0,1,1).data;
  const fx=336,fy=462,fw=349,fh=342,bw=9;
  x.save();rrect(x,fx,fy,fw,fh,48);x.clip();x.fillStyle='rgb('+d[0]+','+d[1]+','+d[2]+')';x.fillRect(fx,fy,fw,fh);
  const ax=fx+bw,ay=fy+bw,aw=fw-2*bw,ah=fh-2*bw,r=Math.min(aw/im.width,ah/im.height),w=im.width*r,h=im.height*r;
  x.drawImage(im,ax+(aw-w)/2,ay+(ah-h)/2,w,h);x.restore();
  x.strokeStyle=navy;x.lineWidth=bw;rrect(x,fx+bw/2,fy+bw/2,fw-bw,fh-bw,44);x.stroke()}
 wipe(235,815,790,892);
 x.textAlign='center';x.fillStyle='#0b2a6b';const nm=(s.name||'').toUpperCase();let fs=70;x.font='bold '+fs+'px '+FF;
 while(x.measureText(nm).width>800&&fs>34){fs-=2;x.font='bold '+fs+'px '+FF}x.fillText(nm,512,877);
 wipe(278,890,744,976);
 const cl=String(s.cls||'').replace(/^STD\s+/i,''),pt='Class : '+cl+(s.house?'   |   House : '+s.house:'');
 x.font='bold 40px '+FF;const pw=Math.min(x.measureText(pt).width+90,860);
 x.fillStyle='#014690';rrect(x,512-pw/2,901,pw,58,29);x.fill();x.fillStyle='#fff';x.fillText(pt,512,945);
 wipe(406,976,952,1247);
 x.textAlign='left';x.fillStyle='#151515';
 [[s.adm,1007],[fd(s.dob),1056],[s.father,1105],[s.phone,1152]].forEach(([v,y])=>{const t=String(v==null?'':v);let f=31;x.font=f+'px '+FF;

 let af=31,al;do{x.font=af+'px '+FF;al=wrapTxt(x,s.addr||'',520);af--}while(al.length>2&&af>22);
 al.slice(0,2).forEach((l,i)=>x.fillText(l,421,1202+i*34));
 return cv}
async function idView(id){const s=S.find(x=>x.id==id);if(!s)return;
 sheet(`<div class="hero sm"><button class="back" data-act="back2" data-id2="${id}">&larr; Back</button><h2>ID card</h2></div><div style="padding:16px;text-align:center"><canvas id="cv" style="width:100%;max-width:380px;border-radius:12px;box-shadow:var(--sh)"></canvas></div><div class="acts"><button class="btn p" data-idpdf="s:${id}">Download PDF</button></div>`);
 try{if(s.photo)await getPhotos([id]);await drawCard($('#cv'),s)}catch(e){toast(e.message)}}
const jpg=(cv,w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(cv,0,0,w,h);return c.toDataURL('image/jpeg',.88)};
async function idpdf(spec){const k=spec.indexOf(':'),kind=spec.slice(0,k),key=spec.slice(k+1);let rows,file;
 if(kind=='s'){rows=S.filter(x=>x.id==key);file='ID_'+(rows[0]?rows[0].name:'').replace(/\s+/g,'_')}
 else if(kind=='c'){rows=S.filter(x=>x.cls==key).sort(cmp);file='ID_Cards_'+key.replace(/\s+/g,'_')}
 else{const h=key=='-'?'':key;rows=S.filter(x=>x.cls!='Passed Out'&&x.house==h).sort(cmp);file='ID_Cards_'+(h||'No_House')}
 if(!rows.length){toast('No students found');return}
 toast('Preparing '+rows.length+' ID card(s)...');
 try{await loadPdf();await getPhotos(rows.filter(s=>s.photo).map(s=>s.id))}catch(e){toast(e.message);return}
 const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),cv=document.createElement('canvas');
 for(let i=0;i<rows.length;i++){if(i&&i%6==0)doc.addPage();const p=i%6,cx=6+(p%3)*67,cy=12+Math.floor(p/3)*99;
  await drawCard(cv,rows[i]);doc.addImage(jpg(cv,768,1152),'JPEG',cx,cy,64,96);doc.setDrawColor(190);doc.setLineWidth(.1);doc.roundedRect(cx,cy,64,96,3.8,3.8)}
 doc.save(file+'.pdf');toast('ID cards downloaded')}
function schoolSet(){const sc=prompt('School name (printed on ID cards and PDFs)',school||SCHOOL0);if(sc===null)return;const se=prompt('Current session, for example 2025-26',session);if(se===null)return;

async function batchCls(items){for(let i=0;i<items.length;i+=400){const b=writeBatch(db);items.slice(i,i+400).forEach(([id,c])=>b.update(doc(SC,id),{cls:c}));await b.commit()}}
async function newSession(){const ns=prompt('Enter the NEW session, for example 2026-27'+(session?' (current: '+session+')':''));if(!ns||!ns.trim())return;
 if(ns.trim()==session){toast('That session is already active');return}
 const a=S.filter(s=>s.cls!='Passed Out').length,g=S.filter(s=>s.cls=='STD XII').length;
 if(!confirm('Start session '+ns.trim()+'?\n\nAll '+a+' students move up one class (Nursery to LKG to UKG to STD I and so on).\n'+g+' students of STD XII become Passed Out.\nA backup is saved first, so you can undo it.\n\nThis changes the data for everyone.'))return;
 if(prompt('Type PROMOTE to confirm')!=='PROMOTE'){toast('Cancelled');return}
 toast('Starting new session...',6000);
 try{await setDoc(doc(db,'backups',String(Date.now())),{at:new Date().toISOString(),session,students:JSON.stringify(S.map(s=>({id:s.id,cls:s.cls})))});
  await batchCls(S.map(s=>[s.id,CL.indexOf(s.cls)]).filter(x=>x[1]>=0).map(([id,j])=>[id,j==CL.length-1?'Passed Out':CL[j+1]]));
  await setDoc(META,{session:ns.trim()},{merge:true});toast('Session '+ns.trim()+' started')}catch(e){toast('Not done: '+e.message,9000)}}
async function undoSession(){try{const q=await getDocs(collection(db,'backups')),ds=q.docs.sort((a,b)=>b.id-a.id);if(!ds.length){toast('No session change to undo');return}
 const bk=ds[0].data(),stu=JSON.parse(bk.students).filter(x=>S.some(s=>s.id==x.id));
 if(!confirm('Undo the last session change? Every student goes back to the class they had before (session '+(bk.session||'not set')+').\n\nClass edits made since then will be lost.'))return;
 await batchCls(stu.map(x=>[x.id,x.cls]));await setDoc(META,{session:bk.session||''},{merge:true});await deleteDoc(ds[0].ref);toast('Session change undone')}catch(e){toast('Not done: '+e.message,8000)}}
const isoD=v=>{if(typeof v=='number'&&v>1){const d=new Date(Math.round((v-25569)*864e5));return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
 const m=String(v).trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');const n=String(v).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);return n?n[0]:''};
async function importFile(f){
 try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js')}catch(e){toast('Internet is needed to read the file');return}
 try{const wb=window.XLSX.read(await f.arrayBuffer(),{type:'array'}),rows=window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true});
  const sp=v=>String(v??'').replace(/\s+/g,' ').trim(),tc=v=>sp(v).toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
  const pick=(r,ns)=>{for(const k in r){if(ns.includes(k.toLowerCase().replace(/[^a-z]/g,'')))return r[k]}return ''};
  const all=[];rows.forEach(r=>{const name=tc(pick(r,['studentsname','studentname','name']));if(!name)return;
   const rc=sp(pick(r,['class'])),u=rc.toUpperCase().replace(/^(STD|CLASS)\.?\s*/,'STD ');
   all.push({cls:CL.find(x=>x.toUpperCase()==u)||rc,name,father:tc(pick(r,['fathersname','fathername'])),mother:tc(pick(r,['mothersname','mothername'])),adm:sp(pick(r,['admissionnumber','admissionno','admno','adm'])),
    dob:isoD(pick(r,['dateofbirth','dob'])),phone:String(pick(r,['phonenumber','phone','mobile'])).replace(/\D/g,''),addr:sp(pick(r,['address'])),house:tc(String(pick(r,['house'])).replace(/house/i,'')),photo:0})});
  const add=all.filter(s=>!S.some(x=>x.adm==s.adm&&x.name==s.name));
  if(!add.length){toast('Nothing new to import ('+all.length+' rows already exist)',5000);return}
  if(!confirm('Import '+add.length+' students'+(all.length>add.length?' ('+(all.length-add.length)+' already exist and will be skipped)':'')+'?'))return;
  toast('Importing...',8000);for(let i=0;i<add.length;i+=400){const b=writeBatch(db);add.slice(i,i+400).forEach(s=>b.set(doc(SC),s));await b.commit()}
  toast('Imported '+add.length+' students',5000)}catch(e){toast('Import failed: '+e.message,8000)}}
function loadPdf(){return new Promise((ok,no)=>{if(window.jspdf&&window.jspdf.jsPDF.API.autoTable)return ok();
 const add=(u,cb)=>{const s=document.createElement('script');s.src=u;s.onload=cb;s.onerror=()=>no(new Error('Internet is needed to create the PDF'));document.head.appendChild(s)};
 add('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>add('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js',ok))})}
async function pdf(kind,key){
 let groups,file;
 if(kind=='c'){const ks=key?[key]:CL.filter(c=>S.some(s=>s.cls==c));groups=ks.map(c=>({title:'Class '+c,rows:S.filter(s=>s.cls==c).sort(cmp)}));file=key?'Class_'+key.replace(/\s+/g,'_'):'All_Classes'}
 else{const ks=key?[key=='-'?'':key]:[...Object.keys(HS),''].filter(h=>S.some(s=>s.cls!='Passed Out'&&s.house==h));groups=ks.map(h=>({title:h?h+' House':'No house assigned',rows:S.filter(s=>s.cls!='Passed Out'&&s.house==h).sort(cmp)}));file=key?(key=='-'?'No_House':'House_'+key):'All_Houses'}
 if(!groups.length||!groups.some(g=>g.rows.length)){toast('No students to print');return}
 toast('Preparing PDF...');
 try{await loadPdf()}catch(e){toast(e.message);return}
 const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'a4'}),today=new Date().toLocaleDateString('en-GB');let title='';
 groups.forEach((g,i)=>{if(i)doc.addPage();title=g.title+': '+g.rows.length+' students';
  doc.autoTable({startY:84,margin:{top:84,left:40,right:40,bottom:40},theme:'striped',styles:{fontSize:9,cellPadding:4},headStyles:{fillColor:[23,50,77]},
   head:[['#','Adm No','Student Name',"Father's Name","Mother's Name",'DOB','Phone',kind=='c'?'House':'Class']],
   body:g.rows.map((s,n)=>[n+1,s.adm,s.name,s.father,s.mother,fd(s.dob),s.phone,kind=='c'?s.house:s.cls]),
   didDrawPage:()=>{doc.setTextColor(20,33,46);doc.addImage(LOGO,'JPEG',40,18,50,49);doc.setFont(undefined,'bold');doc.setFontSize(16);doc.text(school||SCHOOL0,100,40);doc.setFont(undefined,'normal');doc.setFontSize(12);doc.text(title,100,60);doc.setFontSize(9);doc.text('Generated '+today,802,42,{align:'right'})}})});
 const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(9);doc.setTextColor(110);doc.text('Page '+i+' of '+n,802,570,{align:'right'})}
 doc.save(file+'.pdf');toast('PDF downloaded')}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

});
